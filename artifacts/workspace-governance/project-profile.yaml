  - id: "OD-PRODUCT-001"
    question: "What are the detailed workflows and acceptance criteria for each named module?"
    blocking_stage: "Module implementation"
  - id: "OD-SEC-001"
    question: "What are role permissions, account links, and student-data protection rules?"
    blocking_stage: "Identity, schema, and module implementation"
  - id: "OD-API-001"
    question: "What are the API contracts, errors, and compatibility rules?"
    blocking_stage: "API implementation"
  - id: "OD-DELIVERY-001"
    question: "What are supported browsers, hosting targets, regions, and release completion states?"
    blocking_stage: "UI acceptance and deployment"
  - id: "OD-DATA-001"
    question: "What final entity model, remote SQLite placement, backup, restore, and retention rules are required?"
    blocking_stage: "Feature data implementation and deployment"
