task_tracking:
  provider: "clickup"
  workspace_id: "3668514"
  source_of_truth: true
  lists:
    - id: "901821841766"
      name: "Saffna"
      url: "https://app.clickup.com/3668514/v/li/901821841766"
      scopes:
        - "web"
        - "API within web"
        - "database within web"
        - "documentation"
      observed_on: "2026-09-28"
      observed_parent_space: "Eyadaty"
      observed_parent_folder: "unresolved from list-detail response"
      observed_statuses:
        - "to do"
        - "scope defined"
        - "in progress"
        - "complete"
      observed_list_custom_fields: []
      permissions:
        read: "standing authorization for bounded Startup Task Resolution; otherwise disclosed-stage-action"
        comment: "one standing-authorized chat-linkage comment; otherwise approval-required"
        create: "one standing-authorized task after complete duplicate search finds no match; otherwise approval-required"
        mutate_fields: "approval-required"
  public_mirror:
    provider: "github-issues"
    repository: "hasanhalabi/saffna-school-communication"
    url: "https://github.com/hasanhalabi/saffna-school-communication/issues"
    role: "public derived view; never a task source of truth or approval source"
    direction: "ClickUp to GitHub only"
    execution: "same Codex session immediately after an authorized ClickUp mutation"
    scheduled: false
    manual_run: false
    clickup_repository_secret_required: false
    matching:
      task: "hidden stable ClickUp task ID marker"
      comment: "hidden stable ClickUp comment ID marker"
    permissions:
      startup_task_resolution: "standing authorization for the exact resolved primary-task Issue and linkage-comment mirror"
      other_writes: "must accompany and be disclosed with the authorized ClickUp mutation"
  chat_workflow:
    direct_answer_requires_task: false
    work_chat_requires_primary_task: true
    multiple_chats_may_reuse_task: true
    startup_task_resolution_requires_preliminary_approval: false
    implementation_requires_named_stage_approval: true
    task_linkage:
      - "ClickUp task ID in Codex chat title"
      - "One ClickUp linkage comment"
      - "Marker-bearing GitHub Issue and mirrored linkage comment"
    new_task_required_sections:
      - "Objective"
      - "Scope"
      - "Acceptance criteria"
      - "Relevant dependencies"
      - "Automated-testing and validation strategy"
    closeout_trigger: "Explicit product-owner request after an approved stage covers the exact closeout bundle"
    closeout_order:
      - "Post ClickUp closeout comment"
      - "Mirror the closeout comment to GitHub"
      - "Set ClickUp task to the configured closed status"
      - "Close the matching GitHub Issue"
      - "Commit only approved files with the task ID"
      - "Non-force push the approved branch"

governance:
  minimum_confidence: 95
  explicit_stage_approval: true
  approval_expires_on_material_scope_change: true
  workspace_file_work_default: true
  external_actions_require_disclosure: true
  task_status_separate_from_approval: true
  task_backed_closeout_comment_required: true
  standing_local_read_only_discovery: true
  standing_startup_task_resolution: true
  standing_primary_task_github_mirror: true
  single_implementation_handshake_after_task_resolution: true
  closeout_bundle_normally_preapproved_in_stage: true
  github_issues_is_derived_task_view: true
  clickup_mutations_require_same_session_github_mirror: true
  approved_deviations: []

constraints:
  security:
    - "Login required for admin users, teachers, parents, and students; permissions unresolved"
  privacy:
    - "School and student-related personal data is in scope; data controls unresolved"
  regulatory: []
  localization:
    - "Arabic primary with RTL; English with LTR"
  operational:
    - "One Laravel deployable with separate business, API, and Web Component areas"
    - "Bootstrap 5 only as frontend UI library; exact version resolved in later package stage"
    - "Font Awesome Free assets hosted locally; no icon CDN"
    - "Project-authored runtime PHP class and JavaScript component filenames use Saffna prefix"

references:
